name: Release

# 推送形如 `keysound-v0.1.0` 的 tag 即发布该扩展：构建 Windows 包，挂到同名 Release。
# 一个仓里会有多个扩展，所以 tag 带扩展名；包名 `<扩展>-<版本>-windows-x64.zip`。
#
# zip 的顶层就是扩展目录（`keysound/`），直接解压进输入法用户目录的 `extensions\` 即可：
#   keysound/
#     extension.toml  keysound.exe  packs/  LICENSE.txt
#
# 暂不签名：签名额度有限，等扩展定版再接。未签名的程序收到按键事件容易被杀毒软件误报，
# Release 说明里已写明。
on:
  push:
    tags: ["keysound-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 keysound-v0.1.0），需已存在"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: 构建 keysound
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in keysound-v*) ;; *) echo "tag 必须形如 keysound-vX.Y.Z：$TAG"; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#keysound-v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          path: WindInputExtensions
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/checkout@v7
        with:
          repository: huanfeng/WindInput
          path: WindInput
          sparse-checkout: |
            wind_input/Cargo.toml
            wind_input/crates/wind-hook
          sparse-checkout-cone-mode: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: WindInputExtensions

      - name: tag 与 Cargo 版本一致
        shell: bash
        working-directory: WindInputExtensions
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          CARGO_VER=$(cargo metadata --no-deps --format-version 1 \
            | python -c "import sys,json; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='keysound'))")
          [ "$CARGO_VER" = "$VERSION" ] || { echo "tag 版本 $VERSION 与 Cargo.toml 版本 $CARGO_VER 不一致"; exit 1; }

      - name: 构建
        working-directory: WindInputExtensions
        run: cargo build --release --locked -p keysound

      - name: 打包
        shell: bash
        working-directory: WindInputExtensions
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          D=dist/keysound
          mkdir -p "$D"
          cp target/release/keysound.exe "$D/"
          cp keysound/extension.toml "$D/"
          cp -r keysound/packs "$D/packs"
          cp LICENSES/MPL-2.0.txt "$D/LICENSE.txt"
          cd dist
          ZIP="keysound-${VERSION}-windows-x64.zip"
          7z a -tzip "$ZIP" keysound > /dev/null
          sha256sum "$ZIP" > "$ZIP.sha256"
          cat "$ZIP.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: keysound-windows-x64
          path: |
            WindInputExtensions/dist/*.zip
            WindInputExtensions/dist/*.sha256

  publish:
    name: 发布 Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: keysound-windows-x64
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.package.outputs.tag }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          按键音扩展 ${VERSION}（仅 Windows）。

          **安装**：把压缩包里的 \`keysound\` 文件夹整个解压到输入法用户目录的 \`extensions\\\` 下
          （默认 \`%APPDATA%\\WindInput\\extensions\\\`），再到 设置 → 高级 → 扩展程序 里刷新、启用。
          详见[文档](https://windinput.com/docs/guides/extensions)。

          ⚠️ 扩展程序能收到你授权的按键、上屏文字，只安装你信任的扩展。本包暂未签名，杀毒软件可能误报。
          校验：\`keysound-${VERSION}-windows-x64.zip.sha256\`。
          NOTES
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease";; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "按键音 ${VERSION}" --notes-file notes.md $PRE
