[package]
name = "keysound"
version.workspace = true
license.workspace = true
edition.workspace = true

# 扩展程序示例：按键音。随扩展宿主拉起，经 stdio 收按键事件，按键名/分类播放音效。
[[bin]]
name = "keysound"
path = "src/main.rs"

[dependencies]
wind-hook = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_UI_Shell_PropertiesSystem"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
