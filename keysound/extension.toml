# SPDX-License-Identifier: MPL-2.0
name = "按键音"
exe = { windows = "keysound.exe", linux = "keysound", macos = "keysound" }
want = ["key.detail"]
protocol = [1]

[[option]]
key = "theme"
label = "音色"
type = "choice"
default = "keyboard"
choices = [
  { value = "keyboard", label = "键盘" },
  { value = "typewriter", label = "打字机" },
  { value = "piano", label = "钢琴" },
  { value = "marimba", label = "木琴" },
  { value = "custom", label = "自定义" },
]

[[option]]
key = "volume"
label = "音量"
type = "number"
default = 0.6
min = 0.0
max = 1.0
step = 0.05
